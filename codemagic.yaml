workflows:
  am-magic:
    name: AM Magic app
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen || true
          xcodegen generate
      - name: Build (unsigned)
        script: |
          xcodebuild \
            -project AMMagic.xcodeproj \
            -scheme AMMagic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Make the .ipa
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AMMagic.app Payload/
          zip -qr AMMagic.ipa Payload
    artifacts:
      - AMMagic.ipa
